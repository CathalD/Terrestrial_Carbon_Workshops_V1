<svg xmlns="http://www.w3.org/2000/svg" width="760" height="258" viewBox="0 0 760 258" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Grassland carbon by pool</title>
<desc id="d">Horizontal bar chart of mean carbon stock in three pools across six prairie plots: soil to 30 cm 10.97, roots to 30 cm 0.81 and shoots 0.17 kilograms of carbon per square metre. Soil holds 92 per cent of the total and shoots 1 per cent.</desc>
<text x="0" y="20" font-size="15" font-weight="600" fill="#7a7a7a">Where the carbon is — mean of six prairie plots</text>
<text x="0" y="38" font-size="12.5" fill="#9a9a9a">kg C per m² · soil and roots both to 30 cm · share of the total in brackets</text>
<text x="158" y="75.5" font-size="14.5" text-anchor="end" fill="#7a7a7a">Soil, 0–30 cm</text>
<path d="M172.0 54.0 H588.0 A4.0 4.0 0 0 1 592.0 58.0 V82.0 A4.0 4.0 0 0 1 588.0 86.0 H172.0 Z" fill="#6E8B3D"/>
<text x="604.0" y="75.5" font-size="14.5" fill="#7a7a7a"><tspan font-weight="600">10.97</tspan><tspan fill="#9a9a9a">  (91.9%)</tspan></text>
<text x="158" y="131.5" font-size="14.5" text-anchor="end" fill="#7a7a7a">Roots, 0–30 cm</text>
<path d="M172.0 110.0 H198.9 A4.0 4.0 0 0 1 202.9 114.0 V138.0 A4.0 4.0 0 0 1 198.9 142.0 H172.0 Z" fill="#6E8B3D"/>
<text x="214.9" y="131.5" font-size="14.5" fill="#7a7a7a"><tspan font-weight="600">0.81</tspan><tspan fill="#9a9a9a">  (6.8%)</tspan></text>
<text x="158" y="187.5" font-size="14.5" text-anchor="end" fill="#7a7a7a">Shoots</text>
<path d="M172.0 166.0 H175.2 A3.2 3.2 0 0 1 178.3 169.2 V194.8 A3.2 3.2 0 0 1 175.2 198.0 H172.0 Z" fill="#6E8B3D"/>
<text x="190.3" y="187.5" font-size="14.5" fill="#7a7a7a"><tspan font-weight="600">0.17</tspan><tspan fill="#9a9a9a">  (1.4%)</tspan></text>
<text x="0" y="248" font-size="12" fill="#9a9a9a">Soil holds 66× the carbon of the shoots you can see; roots hold 4.9×. Constructed teaching data — see the Worked Example.</text>
</svg>