<title id="t">Carbon in each grassland pool</title>
<desc id="d">Horizontal bar chart of mean carbon in three pools across six prairie plots of the worked example: soil to 30 cm 10.97, roots to 30 cm 0.81 and shoots 0.17 kilograms of carbon per square metre. Soil holds 66× and roots 4.9× the carbon of the shoots.</desc>
