<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Stratifying the study area</title>
<desc id="d">The study boundary divided into three restoration-age strata, each labelled and awaiting an area, with a burn-unit boundary shown as an optional second layer, and a checklist of what makes a stratum worth creating.</desc>
<text x="24" y="28" font-size="14" fill="#898781" text-anchor="start" font-weight="600">Step 2 — dividing the site into meaningfully distinct areas</text>
<text x="24" y="46" font-size="11.5" fill="#a5a49e" text-anchor="start" font-weight="normal">Strata must be mappable, and each needs an area, because the area is what weights it later.</text>
<path d="M40 70 L230 64 L242 176 L52 182 Z" fill="#199e70" opacity="0.20" stroke="#199e70" stroke-width="2.5"/>
<text x="120" y="128" font-size="12" fill="#199e70" text-anchor="middle" font-weight="600">Restored 20 yr</text>
<text x="120" y="144" font-size="11" fill="#a5a49e" text-anchor="middle" font-weight="normal">— ha</text>
<path d="M230 64 L430 58 L446 168 L242 176 Z" fill="#3987e5" opacity="0.20" stroke="#3987e5" stroke-width="2.5"/>
<text x="336" y="122" font-size="12" fill="#3987e5" text-anchor="middle" font-weight="600">Restored 10 yr</text>
<text x="336" y="138" font-size="11" fill="#a5a49e" text-anchor="middle" font-weight="normal">— ha</text>
<path d="M52 182 L242 176 L446 168 L412 268 L92 262 Z" fill="#c98500" opacity="0.20" stroke="#c98500" stroke-width="2.5"/>
<text x="244" y="228" font-size="12" fill="#c98500" text-anchor="middle" font-weight="600">Unrestored</text>
<text x="244" y="244" font-size="11" fill="#a5a49e" text-anchor="middle" font-weight="normal">— ha</text>
<path d="M92 262 L412 268" stroke="#d95926" stroke-width="2" stroke-dasharray="7 5"/>
<text x="252" y="286" font-size="11" fill="#d95926" text-anchor="middle" font-weight="normal">burn unit boundary — a second layer, only if fire is part of the question</text>
<text x="510" y="88" font-size="13" fill="#898781" text-anchor="start" font-weight="600">A stratum earns its place if</text>
<circle cx="516" cy="106" r="3" fill="#199e70"/>
<text x="530" y="110" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">it relates to the project question</text>
<circle cx="516" cy="132" r="3" fill="#199e70"/>
<text x="530" y="136" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">it can be drawn on a map</text>
<circle cx="516" cy="158" r="3" fill="#199e70"/>
<text x="530" y="162" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">its area can be measured</text>
<circle cx="516" cy="184" r="3" fill="#199e70"/>
<text x="530" y="188" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">it will still exist next visit</text>
<text x="510" y="232" font-size="11.5" fill="#a5a49e" text-anchor="start" font-weight="normal">Each extra stratum adds a</text>
<text x="510" y="248" font-size="11.5" fill="#a5a49e" text-anchor="start" font-weight="normal">minimum sample count of its own.</text>
</svg>
