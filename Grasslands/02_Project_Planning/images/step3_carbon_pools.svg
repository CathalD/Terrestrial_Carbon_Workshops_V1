<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Carbon pools and the nested plot</title>
<desc id="d">A nested grassland plot in cross-section: a tree over two metres in a 400 square metre plot, a shrub in the medium plot, ground vegetation in a 0.25 square metre quadrat, and a soil core with depth increments from 0 to 100 centimetres and on to refusal.</desc>
<text x="24" y="28" font-size="14" fill="#898781" text-anchor="start" font-weight="600">Step 3 — the pools, and the plot each is measured in</text>
<line x1="24" y1="186" x2="500" y2="186" stroke="#b9b8b1" stroke-width="2"/>
<line x1="92" y1="186" x2="92" y2="112" stroke="#c98500" stroke-width="4"/>
<ellipse cx="92" cy="98" rx="40" ry="26" fill="#199e70" opacity="0.35"/>
<text x="92" y="60" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">tree &gt; 2 m</text>
<text x="92" y="75" font-size="10.5" fill="#a5a49e" text-anchor="middle" font-weight="normal">400 m² plot</text>
<path d="M210 186 q-4 -32 14 -40 q22 4 16 40 z" fill="#199e70" opacity="0.45"/>
<text x="220" y="130" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">shrub 0.5–2 m</text>
<text x="220" y="145" font-size="10.5" fill="#a5a49e" text-anchor="middle" font-weight="normal">16–100 m² plot</text>
<path d="M300 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M307 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M314 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M321 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M328 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M335 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M342 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M349 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M356 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M363 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M370 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M377 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M384 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M391 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M398 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<path d="M405 186 q2 -12 5 -18" stroke="#199e70" stroke-width="1.6" fill="none" opacity="0.8"/>
<rect x="296" y="156" width="120" height="30" fill="none" stroke="#d95926" stroke-width="2" stroke-dasharray="5 3"/>
<text x="356" y="130" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">ground veg &lt; 0.5 m</text>
<text x="356" y="145" font-size="10.5" fill="#d95926" text-anchor="middle" font-weight="normal">0.25 m² quadrat</text>
<rect x="460" y="186" width="30" height="128" fill="#3987e5" opacity="0.16" stroke="#3987e5" stroke-width="2"/>
<line x1="460" y1="186" x2="490" y2="186" stroke="#3987e5" stroke-width="1.2"/>
<text x="498" y="203" font-size="10.5" fill="#a5a49e" text-anchor="start" font-weight="normal">0–10 cm</text>
<line x1="460" y1="212" x2="490" y2="212" stroke="#3987e5" stroke-width="1.2"/>
<text x="498" y="229" font-size="10.5" fill="#a5a49e" text-anchor="start" font-weight="normal">10–20 cm</text>
<line x1="460" y1="238" x2="490" y2="238" stroke="#3987e5" stroke-width="1.2"/>
<text x="498" y="255" font-size="10.5" fill="#a5a49e" text-anchor="start" font-weight="normal">20–30 cm</text>
<line x1="460" y1="264" x2="490" y2="264" stroke="#3987e5" stroke-width="1.2"/>
<text x="498" y="281" font-size="10.5" fill="#a5a49e" text-anchor="start" font-weight="normal">30–60 cm</text>
<line x1="460" y1="290" x2="490" y2="290" stroke="#3987e5" stroke-width="1.2"/>
<text x="498" y="307" font-size="10.5" fill="#a5a49e" text-anchor="start" font-weight="normal">60–100 cm</text>
<text x="475" y="174" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">soil + roots</text>
<text x="475" y="332" font-size="10.5" fill="#3987e5" text-anchor="middle" font-weight="normal">to refusal</text>
<text x="590" y="104" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Each pool is divided by</text>
<text x="590" y="122" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">ITS OWN plot area, which</text>
<text x="590" y="140" font-size="12" fill="#898781" text-anchor="start" font-weight="normal">is what makes them addable.</text>
<text x="590" y="176" font-size="12" fill="#a5a49e" text-anchor="start" font-weight="normal">A clipped sample is a</text>
<text x="590" y="194" font-size="12" fill="#a5a49e" text-anchor="start" font-weight="normal">standing crop at that</text>
<text x="590" y="212" font-size="12" fill="#a5a49e" text-anchor="start" font-weight="normal">moment — not a stock.</text>
</svg>
